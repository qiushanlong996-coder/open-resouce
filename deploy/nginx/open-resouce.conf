server {
    listen 80;
    listen [::]:80;
    # Temporary encrypted public IP entry while ICP filing is pending.
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name openresource.cn www.openresource.cn;

    ssl_certificate /etc/open-resouce/tls/development.crt;
    ssl_certificate_key /etc/open-resouce/tls/development.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/open-resouce/current;
    index index.html;

    location ~ ^/api/v1/projects/[^/]+/collaboration/ws$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Preserve the non-standard development port so the WebSocket
        # library can enforce same-origin checks for https://IP:8443.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The Gateway is only reachable through this local proxy. Replace any
        # client-supplied forwarding chain so rate limits cannot be bypassed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
