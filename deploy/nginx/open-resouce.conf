# 新猿译码 / openresource.cn
#
# 备案通过后搬到标准 443。保留 8443 监听：DNS 切过来之前
# https://<IP>:8443 仍是唯一可用入口，运维与回归脚本也都指着它。
# 证书为阿里云签发的 DigiCert DV，SAN 覆盖 openresource.cn 与 www.openresource.cn。
#
# 注意 :80 不加 default_server —— nginx.conf 里已经有一个默认块，
# 重复声明会让整个配置 nginx -t 不通过。

server {
    listen 80;
    listen [::]:80;
    server_name openresource.cn www.openresource.cn;
    return 301 https://www.openresource.cn$request_uri;
}

# 裸域 → www，统一规范域名（证书覆盖两者，跳转不会告警）。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openresource.cn;

    ssl_certificate     /etc/open-resouce/tls/openresource.cn.pem;
    ssl_certificate_key /etc/open-resouce/tls/openresource.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.openresource.cn$request_uri;
}

# 主站。443 上没有别的 server，用 default_server 兜住按 IP 访问的情况。
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name www.openresource.cn;

    ssl_certificate     /etc/open-resouce/tls/openresource.cn.pem;
    ssl_certificate_key /etc/open-resouce/tls/openresource.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 先给一天。HSTS 下发后很难撤回，稳定运行一段时间再调到一年。
    add_header Strict-Transport-Security "max-age=86400" always;

    root /var/www/open-resouce/current;
    index index.html;

    location ~ ^/api/v1/projects/[^/]+/collaboration/ws$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 用 $http_host 而不是 $host：协作 WebSocket 要做同源校验，
        # 非标端口（8443）必须原样带过去。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Gateway 只能经本地代理访问。覆盖客户端传来的转发链，
        # 否则限流可以被伪造的 X-Forwarded-For 绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # RSS 订阅源：/feed.xml 转发给 Gateway 生成 Atom。
    location = /feed.xml {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO 站点地图：/sitemap.xml 转发给 Gateway 生成。
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        # 只用 add_header，不叠 `expires`：两者都会发 Cache-Control，
        # 重复头对部分代理行为不确定。产物文件名带内容哈希，immutable 是正确语义。
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
